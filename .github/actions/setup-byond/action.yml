name: Setup BYOND
description: Install BYOND and runtime libraries needed for CI jobs.

runs:
  using: composite
  steps:
    - name: Install Dependencies
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libcurl4t64:i386 libstdc++6:i386 libgcc-s1:i386

    - name: Cache BYOND
      uses: actions/cache@v6
      with:
        path: ~/BYOND
        key: ${{ runner.os }}-byond-${{ hashFiles('buildByond.conf')}}
        restore-keys: ${{ runner.os }}-byond

    - name: Setup BYOND
      shell: bash
      run: |
        tools/ci/install_byond.sh
        cd $GITHUB_WORKSPACE
        printenv
        echo "BYOND_SYSTEM=/home/runner/BYOND/byond" >> $GITHUB_ENV
        echo "/home/runner/BYOND/byond/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=/home/runner/BYOND/byond/bin:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "MANPATH=/home/runner/BYOND/byond/man:$MANPATH" >> $GITHUB_ENV
