# Content-type labels by path. Area labels come from .github/pr-labeler.
C-Sound:
- changed-files:
  - any-glob-to-any-file: sound/**
  - any-glob-to-any-file: code/modules/sound/**
  - any-glob-to-any-file: '**/*.ogg'
C-Sprites:
- changed-files:
  - any-glob-to-any-file: icons/**
  - any-glob-to-any-file: '**/*.dmi'
C-Documentation:
- changed-files:
  - any-glob-to-any-file: '**/*.md'
